<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход · RadioPump</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <header class="topbar">
      <div class="shell topbar__inner">
        <a class="brand" href="index.html"><span class="brand__mark">RP</span><span>RadioPump</span></a>
        <nav class="nav" aria-label="Навигация">
          <a href="index.html">Главная</a>
          <a href="library.html">Библиотека</a>
          <a href="waves.html">Волны</a>
          <a href="player.html">Плеер</a>
          <a href="admin-login.html">Админ</a>
        </nav>
        <button class="pill" type="button" data-theme-toggle>Тема</button>
      </div>
    </header>

    <main class="shell page">
      <section class="page-head">
        <div>
          <h1>Вход</h1>
          <p>Админский доступ нужен для загрузки и удаления файлов.</p>
        </div>
      </section>

      <section class="grid">
        <div class="panel span-5">
          <div class="panel__body">
            <form class="form" data-login-form>
              <div class="field">
                <label for="name">Логин</label>
                <input id="name" name="name" autocomplete="username" required />
              </div>
              <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="button button--primary" type="submit">Войти</button>
              <div class="status" data-login-status></div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
