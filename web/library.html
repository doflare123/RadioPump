<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Библиотека · RadioPump</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="library">
    <header class="topbar">
      <div class="shell topbar__inner">
        <a class="brand" href="index.html"><span class="brand__mark">RP</span><span>RadioPump</span></a>
        <nav class="nav" aria-label="Навигация">
          <a href="index.html">Главная</a>
          <a href="library.html">Библиотека</a>
          <a href="waves.html">Волны</a>
          <a href="player.html">Плеер</a>
          <a href="admin-login.html">Админ</a>
        </nav>
        <button class="pill" type="button" data-theme-toggle>Тема</button>
      </div>
    </header>

    <main class="shell page">
      <section class="page-head">
        <div>
          <h1>Библиотека</h1>
          <p>Открытый список загруженных треков.</p>
        </div>
      </section>

      <section class="grid">
        <div class="panel span-8">
          <div class="panel__body stack">
            <div class="status" data-error></div>
            <div class="track-list" data-track-list></div>
          </div>
        </div>
        <aside class="panel span-4">
          <div class="panel__body player">
            <div class="now-playing">
              <div>
                <div class="track-title" data-current-title>Трек не выбран</div>
                <div class="track-meta" data-current-artist>Выберите трек из списка</div>
              </div>
            </div>
            <audio controls preload="metadata" data-main-audio></audio>
          </div>
        </aside>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
