<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadioPump · Прямой эфир</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="radio.css">
</head>
<body data-page="radio">
  <header class="topbar"><div class="shell topbar__inner">
    <a class="brand" href="index.html"><span class="brand__mark">RP</span><span>RadioPump</span></a>
    <nav class="nav" aria-label="Навигация"><a href="index.html">Радио</a><a href="admin-login.html">Админ</a></nav>
    <button class="pill" type="button" data-theme-toggle>Тема</button>
  </div></header>
  <main class="shell page radio-page">
    <div class="radio-heading"><div><p class="eyebrow">МУЗЫКА В ОБЩЕМ ЭФИРЕ</p><h1>На своей волне</h1><p class="muted">Выбирайте станцию. Музыка уже играет.</p></div>
      <label class="volume">Громкость <input data-volume type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость эфира"></label>
    </div>
    <p data-radio-status class="muted" role="status">Подключаемся к станциям…</p>
    <div data-stations class="station-list"></div>
  </main>
  <template id="station-template">
    <article class="station panel">
      <div class="station-header"><div><h2 data-name></h2><div class="station-tags" data-tags></div></div>
        <button type="button" class="button button--primary station-play" data-play>Слушать</button></div>
      <div class="station-body">
        <div class="artwork"><div class="vinyl" aria-label="Обложки нет: виниловая пластинка"><span>RP</span></div><img data-cover hidden alt="Обложка альбома" loading="lazy"></div>
        <div class="station-track"><p class="eyebrow" data-live>ПРЯМОЙ ЭФИР</p><h3 data-title>Ожидаем музыку</h3><p data-artist class="artist"></p><p data-album class="muted"></p>
          <div class="track-timing"><span data-elapsed>0:00</span><span data-duration>—</span></div>
          <progress data-progress max="1" value="0" aria-label="Прошло от трека"></progress>
          <p class="connection" data-connection role="status"></p>
        </div>
      </div>
      <details class="station-details"><summary><span class="drawer-handle"></span><span>История и очередь</span></summary>
        <div class="station-schedule"><section><h3>Уже звучало <small>последние 5</small></h3><ol data-history></ol></section><section><h3>Дальше в эфире <small>следующие 5</small></h3><ol data-queue></ol></section></div>
      </details>
    </article>
  </template>
  <script src="config.js"></script><script src="app.js"></script><script type="module" src="service/radio.js"></script>
</body>
</html>
