name: radiopump
description: Компактный клиент self-hosted радио RadioPump.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

# Плагины ограничены аудио и интеграцией с ОС. HTTP, JSON, состояние и навигация
# используют SDK; браузер, FFmpeg и сервер в клиент не включаются.
dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_cache_manager: ^3.4.5
  just_audio: ^0.10.5
  just_audio_windows:
    path: packages/just_audio_windows
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  screen_retriever: ^0.2.0
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/tray.png
